<!doctype html>
<html lang="en" data-scheme="auto" data-type="expressive">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak Giraffe</title>
<meta name="description" content="An interactive field school for Nonviolent Communication, Conscious Discipline and 30+ communication models — with real-life scenarios, age-by-age guidance, tools and challenges.">
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e2a72e'/%3E%3Cpath d='M18 14c8 2 10 9 9 16 6-6 15-6 19 1-6 0-11 3-12 9l-3 12h-7l2-13c-6-3-9-10-8-25z' fill='%231d2b24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<svg class="patches" aria-hidden="true" focusable="false"><use href="#patch-field"/></svg>

<div class="shell">
  <header class="rail" id="rail">
    <a class="brand" href="#home" aria-label="Speak Giraffe home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path d="M18 10c9 2 11 10 10 18 6-6 16-6 20 1-6 0-11 3-12 9l-3 16h-8l2-15c-7-4-10-12-9-29z" fill="currentColor"/><circle cx="22" cy="16" r="1.8" fill="var(--bg)"/></svg>
      </span>
      <span class="brand-word">Speak<br>Giraffe</span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <div class="xp" id="xp" title="Your practice points"></div>
      <button class="btn ghost settings-btn" id="settings-btn" aria-haspopup="dialog" aria-controls="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="4"/><circle cx="17" cy="9" r="3"/><circle cx="10" cy="17" r="4.5"/></svg>
        <span>Look &amp; feel</span>
      </button>
    </div>
  </header>

  <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="rail">
    <span></span><span></span><span></span><b class="sr">Menu</b>
  </button>

  <main id="main" tabindex="-1"></main>
</div>

<dialog id="settings" class="sheet" aria-labelledby="settings-title">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-head">
      <h2 id="settings-title">Look &amp; feel</h2>
      <button class="icon-btn" value="close" aria-label="Close settings">×</button>
    </div>
    <fieldset>
      <legend>Colour scheme</legend>
      <div class="swatches" id="theme-swatches"></div>
    </fieldset>
    <fieldset>
      <legend>Typography</legend>
      <div class="typepicks" id="type-picks"></div>
    </fieldset>
    <fieldset class="row-fields">
      <label>Text size <input type="range" id="text-size" min="0.9" max="1.3" step="0.05" value="1"></label>
      <label class="toggle"><input type="checkbox" id="motion-toggle"> Calm mode (less motion)</label>
    </fieldset>
    <fieldset>
      <legend>Your progress</legend>
      <p class="muted small">Progress, journal entries and badges stay in this browser only.</p>
      <button type="button" class="btn ghost danger" id="reset-progress">Reset all progress</button>
    </fieldset>
  </form>
</dialog>

<div class="toast-zone" id="toasts" role="status" aria-live="polite"></div>

<!-- shared SVG defs -->

</body>
